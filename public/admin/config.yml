backend:
  name: github
  repo: paul042008/space-hub-studio    # <-- YOUR GitHub repo
  branch: main
  base_url: https://space-hub-studio.vercel.app   # <-- YOUR live site URL

# Where uploaded images will be stored (relative to project root)
media_folder: "public/images/portfolio"
public_folder: "/images/portfolio"

collections:
  - name: "portfolio"
    label: "Portfolio Items"
    folder: "src/data/portfolio-items"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Corporate", "Events", "Brand", "Weddings", "Studio Portraits"] }
      - { label: "Image", name: "imageUrl", widget: "image" }